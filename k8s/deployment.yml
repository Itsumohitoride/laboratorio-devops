# ============================================================================
# deployment.yml — Deployment de la app laboratorio-devops
#
# El nombre del Deployment y del contenedor coinciden con las variables
# K8S_DEPLOYMENT del Jenkinsfile: `kubectl set image` los referencia por
# nombre exacto. La imagen usa el tag `latest`; el pipeline la actualiza
# después con el tag versionado (BUILD_NUMBER).
#
# Ambas probes consultan GET /healthz en el puerto 3000.
# ============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: laboratorio-devops
  labels:
    app.kubernetes.io/name: laboratorio-devops
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: laboratorio-devops

spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: laboratorio-devops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laboratorio-devops
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: laboratorio-devops
    spec:
      containers:
        - name: laboratorio-devops
          image: naviandres/laboratorio-devops:latest
          # IfNotPresent: los tags versionados son inmutables, se hace pull
          # solo si la imagen no existe en el nodo (evita ErrImagePull en
          # clusters kind/dev con la imagen precargada).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http

          # Sin requests/limits declarados, Prometheus no reporta métricas
          # de CPU/memoria de estos pods.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
