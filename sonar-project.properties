# Configuración del scanner de SonarQube/SonarCloud para este repositorio.
# El token NUNCA se declara aquí: el action lo toma de la variable de entorno
# SONAR_TOKEN (secret de GitHub Actions). Ver SECURITY_SETUP.md.

# Valores generados por SonarCloud al crear el proyecto (no inventados)
sonar.projectKey=Itsumohitoride_laboratorio-devops
sonar.organization=itsumohitoride

# Analizar todo el código fuente desde la raíz del repositorio
sonar.sources=.

# Exclusiones: dependencias instaladas y reportes generados, no son código del proyecto
sonar.exclusions=node_modules/**

# Codificación explícita para resultados deterministas
sonar.sourceEncoding=UTF-8
